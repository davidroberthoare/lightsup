<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report</title>
  <link rel="stylesheet" href="./css/tabulator.min.css">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#111111">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    /* local overrides */
    body{
      padding: 20px;
      width:auto;
    }
    header{
      display: flex;
      justify-content: space-between;
    }
    #title_block{
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
    }
    .title_row{
      display: flex;
    }
    .title_row > div{
      margin: 4px 10px;
    }
  </style>
</head>

<body>
  <header>
    <h3 id="report_title">Instrument Schedule</h3>
    <div id="title_block">
      <div class="title_row" style="font-weight: bold;">
        <div data-id="name"></div>
        <div data-id="company"></div>
      </div>
      <div class="title_row" style="border-top: thin solid grey;">
        <div data-id="venue"></div>
        <div data-id="date"></div>
        <div data-id="designer"></div>
      </div>
    </div>
  </header>
  <div id="report"></div>


  <script src="./js/alasql.min.js"></script>
  <script src="./js/tabulator.min.js"></script>
  <script type="module" src="./js/report-main.js"></script>
  <script src="./js/register-sw.js"></script>
</body>

</html>
