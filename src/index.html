<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Theatrical Lighting Program</title>
  <link rel="stylesheet" href="./css/bulma.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <div id="navbarBasicExample" class="navbar-menu">
      <div class="navbar-start">
        <div class="navbar-item has-dropdown is-hoverable">
          <a class="navbar-link">
            File
          </a>

          <div class="navbar-dropdown">
            <a class="navbar-item" id="new_show">
              New Show
            </a>
            <a class="navbar-item" id="load">
              Load Saved
            </a>
            <a class="navbar-item" id="save">
              Save
            </a>
          </div>
        </div>
        <div class="navbar-item has-dropdown is-hoverable">
          <a class="navbar-link">
            Edit
          </a>

          <div class="navbar-dropdown">
            <a class="navbar-item" id="undo_item">
              Undo
            </a>
            <a class="navbar-item" id="redo_item">
              Redo
            </a>
          </div>
        </div>
        <!-- add menu -->
        <div class="navbar-item has-dropdown is-hoverable" id="menu_insert">
          <a class="navbar-link">
            Insert
          </a>
          <div class="navbar-dropdown">

            <div class="nested dropdown">
              <a class="navbar-item">
                <span class="icon-text ">
                  <span>Fixtures</span>
                  <span class="icon">›</span>
                </span>
              </a>

              <div class="dropdown-menu" role="menu">
                <div class="dropdown-content" id="fixtures_menu">
                  <!-- fixtures will be added here, loaded from config file -->
                </div>
              </div>
            </div>

            <div class="nested dropdown">
              <a class="navbar-item">
                <span class="icon-text ">
                  <span>Positions</span>
                  <span class="icon">›</span>
                </span>
              </a>

              <div class="dropdown-menu" role="menu">
                <div class="dropdown-content">
                  <a class="dropdown-item" data-type="position" data-subtype="pipe">
                    Pipe
                  </a>
                  <a class="dropdown-item" data-type="position" data-subtype="box">
                    Truss
                  </a>
                </div>
              </div>
            </div>

            <div class="nested dropdown">
              <a class="navbar-item">
                <span class="icon-text ">
                  <span>Shapes</span>
                  <span class="icon">›</span>
                </span>
              </a>

              <div class="dropdown-menu" role="menu">
                <div class="dropdown-content">
                  <a class="dropdown-item" data-type="shape" data-subtype="box">
                    Box
                  </a>
                  <a class="dropdown-item" data-type="shape" data-subtype="circle">
                    Circle
                  </a>
                  <a class="dropdown-item" data-type="shape" data-subtype="line">
                    Line
                  </a>
                  <a class="dropdown-item" data-type="shape" data-subtype="arrow">
                    Arrow
                  </a>
                </div>
              </div>
            </div>

          </div>

        </div>

        <a class="navbar-item" href="report.html" target="_blank">Reports</a>

      </div>

      <div class="navbar-end">
        <div class="navbar-item">
          <div class="select is-small">
            <select id="show_select" title="Current show"></select>
          </div>
        </div>
      </div>
    </div>
  </nav>




  <div id="floating-panel" class="panel is-primary expanded">
    <button id="toggle-panel" class="">||</button>
    <div class="panel-block" style="flex-direction: column; justify-content: space-between; height: 100%;">

      <form id="inspector">
        <h2>Fixture Details:</h2>

        <div class="field is-horizontal">
          <div class="field-label is-small"><label class="label">Label</label></div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input name="label" class="input is-small" type="text" placeholder="FOH-1">
              </div>
            </div>
          </div>
        </div>

        <div class="field is-horizontal">
          <div class="field-label is-small"><label class="label">Dimmer</label></div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input name="dimmer" class="input is-small" type="text" placeholder="123">
              </div>
            </div>
          </div>
        </div>

        <div class="field is-horizontal">
          <div class="field-label is-small"><label class="label">Channel</label></div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input name="channel" class="input is-small" type="text" placeholder="234">
              </div>
            </div>
          </div>
        </div>

        <div class="field is-horizontal">
          <div class="field-label is-small"><label class="label">Gel</label></div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input name="gel" class="input is-small" type="text" placeholder="R60">
              </div>
            </div>
          </div>
        </div>

      </form>


      <hr>
      <form id="show_inspector">
        <h2>Show Details:</h2>
        <div class="field is-horizontal">
          <div class="field-label is-small"><label class="label">Name</label></div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input name="name" class="input is-small" type="text" placeholder="show name">
              </div>
            </div>
          </div>
        </div>

        <div class="field is-horizontal">
          <div class="field-label is-small"><label class="label">Company</label></div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input name="company" class="input is-small" type="text" placeholder="company">
              </div>
            </div>
          </div>
        </div>

        <div class="field is-horizontal">
          <div class="field-label is-small"><label class="label">Venue</label></div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input name="venue" class="input is-small" type="text" placeholder="Venue">
              </div>
            </div>
          </div>
        </div>

        <div class="field is-horizontal">
          <div class="field-label is-small"><label class="label">Designer</label></div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input name="designer" class="input is-small" type="text" placeholder="designer name">
              </div>
            </div>
          </div>
        </div>

        <div class="field is-horizontal">
          <div class="field-label is-small"><label class="label">Date</label></div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input name="date" class="input is-small" type="text" placeholder="date">
              </div>
            </div>
          </div>
        </div>

      </form>


    </div>
  </div>




  <div id="container">
    <canvas id="paper"></canvas>
  </div>



  <div id="footer">
    <div id="status_1">-</div>
    <div id="status_2">-</div>
    <div id="status_3">-</div>
  </div>


  <div class="modal" id="load_show_modal">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">Open a Show</p>
        <button class="delete" aria-label="close" id="load_show_modal_close"></button>
      </header>
      <section class="modal-card-body">
        <table class="table is-fullwidth is-hoverable" id="load_show_table">
          <thead>
            <tr>
              <th>Show</th>
              <th>Last saved</th>
            </tr>
          </thead>
          <tbody>
            <!-- rows injected from the saved shows -->
          </tbody>
        </table>
      </section>
    </div>
  </div>


  <script src="./js/alasql.min.js"></script>
  <script src="./js/jquery.min.js"></script>
  <script src="./js/fabric.min.js"></script>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
